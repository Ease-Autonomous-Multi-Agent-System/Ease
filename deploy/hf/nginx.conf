# Ease single-container gateway (runs as an unprivileged user).
#   :7860            public: web app at "/", API + live updates at "/backend/"
#   127.0.0.1:8080   demo test sites for the browser agent (not reachable from outside the container)
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # The visitor's IP, for per-IP rate limits. The container is only reachable through Hugging Face's proxy,
    # which appends the address it saw to X-Forwarded-For, so the LAST entry is the real visitor (earlier entries
    # could be client-supplied and are dropped). Without the header, the connecting address is used.
    map $http_x_forwarded_for $client_ip {
        "~(?<last>[0-9A-Fa-f.:]+)\s*$" $last;
        default                         $remote_addr;
    }

    server {
        listen 7860;
        server_name _;
        client_max_body_size 8m;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $client_ip;     # one address only - never the client-supplied list
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location /backend/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }

    server {
        listen 127.0.0.1:8080;
        root /app/fixtures;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        location / { try_files $uri $uri/ $uri.html =404; }
        location = /nginx.conf { return 404; }
    }
}
