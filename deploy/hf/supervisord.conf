; Every Ease process in one container. Children inherit the environment prepared by start.sh.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D %(ENV_DATA_DIR)s/pg -h 127.0.0.1 -k /tmp -p 5432
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=uvicorn ease.api.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips 127.0.0.1
directory=/app/backend
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=celery -A ease.worker.celery_app worker -Q agent,io -n worker@%%h --concurrency 2 --max-tasks-per-child 10 --loglevel INFO
directory=/app/backend
priority=20
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:beat]
command=celery -A ease.worker.celery_app beat --loglevel WARNING --schedule /tmp/celerybeat-schedule
directory=/app/backend
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=node /app/web/server.js
directory=/app/web
environment=PORT="3000",HOSTNAME="127.0.0.1",NODE_ENV="production",API_INTERNAL_URL="http://127.0.0.1:8000"
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -e /dev/stderr -c /app/deploy/nginx.conf -g "daemon off;"
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
