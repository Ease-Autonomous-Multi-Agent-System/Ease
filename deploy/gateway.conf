# Ease gateway: one address for the web app ("/") and the API + live updates ("/backend/").
# Used by `docker compose --profile web up` (http://localhost:3000 on this machine).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The protocol the visitor used: https when a TLS proxy sits in front.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# The visitor's real IP. Cloudflare sets Cf-Connecting-Ip and overwrites any value a client sends; anything else
# is replaced by the address that actually connected. Never pass on a client-supplied X-Forwarded-For.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;  # with the port: the same-origin checks compare it with Origin
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /backend/ {
        proxy_pass http://api:8000/;
        proxy_read_timeout 3600s;  # live-update WebSockets stay open for the whole run
        proxy_send_timeout 3600s;
    }

    # the interactive API docs stay local-only (http://127.0.0.1:8000/docs)
    location ~ ^/backend/(docs|redoc|openapi\.json) { return 404; }

    location / {
        proxy_pass http://web:3000;
    }
}
