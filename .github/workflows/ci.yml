name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact --config .gitleaks.toml -v .

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ease
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ease
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ease" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://ease:ci-only-password@127.0.0.1:5432/ease
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000000
      VAULT_MASTER_KEY: Y2ktb25seS12YXVsdC1rZXktMzItYnl0ZXMtbG9uZyE=
      LLM_CACHE_MODE: "off"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check ease tests
      - name: migrations (up, down, up)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: unit tests
        run: pytest -q
      - name: integration tests
        run: pytest -q -m integration tests/integration
