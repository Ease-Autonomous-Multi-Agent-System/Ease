# Submissions are recorded here, by the server, so the benchmark scores "submitted" from what the site received
# rather than from any agent's own report.
log_format receipt '$time_iso8601 $request_method $request_uri';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    location = /jobs/receipt {
        access_log /var/log/fixtures/receipts.log receipt;
        if ($request_method != POST) { return 405; }
        return 204;
    }
    location = /nginx.conf { return 404; }
}
