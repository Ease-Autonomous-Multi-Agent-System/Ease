server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    location = /nginx.conf { return 404; }
}
